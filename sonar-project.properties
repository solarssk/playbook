# SonarCloud CI-based analysis (see the test job in .github/workflows/ci.yml).
# Requires SonarCloud's "Automatic Analysis" to be off for this project
# (Administration -> Analysis Method): the two modes are mutually exclusive.

sonar.projectKey=solarssk_playbook
# sonar.organization is not committed. CI passes it from the SONAR_ORGANIZATION repository
# variable, so this file names no account other than the repository's own.

# Real paths, not globs: sonar.sources and sonar.tests never accept wildcards.
sonar.sources=scripts,.github
sonar.tests=scripts
sonar.test.inclusions=scripts/**/*.test.mjs
sonar.exclusions=scripts/**/*.test.mjs

sonar.javascript.lcov.reportPaths=coverage/lcov.info
