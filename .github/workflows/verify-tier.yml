name: Verify tier

# A reusable workflow other repositories call to check themselves against
# the playbook's tier checklist (docs/tiers.md). Pin the call to a commit
# SHA, the same rule this repo asks of everyone else (§1): a floating tag
# or `@main` here means a change to this workflow can silently change what
# "passing" means in every repo that calls it, with no diff for any of
# them to review. This repo's own verify-tier.mjs would flag an adopting
# repo's own `uses: ...@v0.1.1` (a tag, not a SHA) as exactly this kind of
# violation -- it would be inconsistent to recommend anything looser here.
#
# What this can and can't check: file/pattern checks (LICENSE, CODEOWNERS,
# SHA-pinning, etc.) always run. Repo-settings checks (delete-branch-on-merge,
# Dependabot status, branch protection) need `admin_token`, an admin-scoped
# PAT passed as a secret: `administration` isn't a grantable GITHUB_TOKEN
# permission, so there's no way around this without one. Without it, those
# checks are skipped and reported as such, not silently omitted. See
# docs/ci-cookbook.md #12 for the full reasoning.
#
# Usage, in the calling repository's own workflow:
#
#   jobs:
#     verify-standard:
#       uses: solarssk/playbook/.github/workflows/verify-tier.yml@<commit-sha>  # v0.1.1
#       secrets:
#         admin_token: ${{ secrets.PLAYBOOK_ADMIN_TOKEN }}  # optional
#
# Tier is auto-detected from the calling repo's own AGENTS.md ("Tier: N" line,
# added by the pointer block documented in this repo's AGENTS.md) unless the
# `tier` input below overrides it.
#
# PLAYBOOK_RELEASE below is bumped in the same commit as the CHANGELOG entry
# for every release, and release.yml refuses to publish a tag that disagrees
# with it. It is hardcoded because there is no reliable way to read back "the
# ref the caller used to invoke this workflow" from inside a `workflow_call`
# job (github.action_ref tracks the most recently *run action step*, not the
# calling ref -- confirmed the hard way, by a real cross-repo run picking up
# actions/checkout's own SHA instead). Checked out explicitly below, it means
# the script that runs always matches this exact version of this exact file.
#
# The same value is what the run compares against the playbook's latest
# GitHub Release, to warn a caller that a newer version exists (see
# docs/ci-cookbook.md #13).

on:
  workflow_call:
    inputs:
      tier:
        description: 'Tier to verify against (0-3). Leave unset to auto-detect from AGENTS.md.'
        required: false
        type: string
        default: 'auto'
    secrets:
      admin_token:
        description: 'Optional PAT with repository admin access, for the settings-level checks. Repo-settings checks are skipped, not failed, without it.'
        required: false

permissions:
  contents: read

env:
  # Bump this alongside every tag (see the comment above), together with the
  # literal `ref:` of the playbook checkout below. Both name the release this job
  # checks itself out at, independent of whatever ref the caller used;
  # scripts/release-check.mjs fails if they differ.
  PLAYBOOK_RELEASE: v0.1.1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the playbook itself, at this workflow's own release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: solarssk/playbook
          ref: v0.1.1 # a literal, not ${{ env.PLAYBOOK_RELEASE }}; release-check keeps the two equal
          path: .playbook-tools
          persist-credentials: false
          sparse-checkout: |
            scripts
            docs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Run tier verification
        env:
          INPUT_TIER: ${{ inputs.tier }}
          ADMIN_TOKEN: ${{ secrets.admin_token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}  # read-only lookup of the latest playbook release
        run: node .playbook-tools/scripts/verify-tier.mjs
