name: Verify tier

# A reusable workflow other repositories call to check themselves against
# the playbook's tier checklist (docs/tiers.md). Pin the call to a commit
# SHA, the same rule this repo asks of everyone else (§1): a floating tag
# or `@main` here means a change to this workflow can silently change what
# "passing" means in every repo that calls it, with no diff for any of
# them to review. This repo's own verify-tier.mjs would flag an adopting
# repo's own `uses: ...@v0.1.1` (a tag, not a SHA) as exactly this kind of
# violation -- it would be inconsistent to recommend anything looser here.
#
# What this can and can't check: file/pattern checks (LICENSE, CODEOWNERS,
# SHA-pinning, etc.) always run. Repo-settings checks (delete-branch-on-merge,
# Dependabot status, branch protection) need `admin_token`, an admin-scoped
# token passed as a secret (a GitHub App installation token or fine-grained PAT).
# `administration` isn't a grantable GITHUB_TOKEN permission. Without it, those
# checks are skipped and reported as such, not silently omitted. See
# docs/ci-cookbook.md #12 for the full reasoning.
#
# Usage, in the calling repository's own workflow:
#
#   jobs:
#     verify-standard:
#       uses: solarssk/playbook/.github/workflows/verify-tier.yml@<commit-sha>  # v0.1.1
#       secrets:
#         admin_token: ${{ secrets.PLAYBOOK_ADMIN_TOKEN }}  # optional
#
# Tier is auto-detected from the calling repo's own AGENTS.md ("Tier: N" line,
# added by the pointer block documented in this repo's AGENTS.md) unless the
# `tier` input below overrides it.
#
# job.workflow_sha identifies the called workflow's own commit on GitHub.com.
# github.sha and github.workflow_sha identify the caller and must not be used
# for this checkout. GitHub Enterprise Server is not supported.
# PLAYBOOK_RELEASE is release-notification metadata, not a source-code ref.

on:
  workflow_call:
    inputs:
      tier:
        description: 'Tier to verify against (0-3). Leave unset to auto-detect from AGENTS.md.'
        required: false
        type: string
        default: 'auto'
    secrets:
      admin_token:
        description: 'Optional read-only GitHub App installation token or fine-grained PAT for settings checks. Checks are skipped without it.'
        required: false
    outputs:
      automated_checks:
        description: 'passed or failed: the hard checks only, not full compliance.'
        value: ${{ jobs.verify.outputs.automated_checks }}
      assessment:
        description: 'partial or failed: manual requirements and effective enforcement are not certified.'
        value: ${{ jobs.verify.outputs.assessment }}

permissions:
  contents: read

env:
  # Bump with the CHANGELOG in each release commit. Source identity comes from
  # job.workflow_sha, independently of this release-notification metadata.
  PLAYBOOK_RELEASE: v0.2.0

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      automated_checks: ${{ steps.verification.outputs.automated_checks }}
      assessment: ${{ steps.verification.outputs.assessment }}
    steps:
      - name: Validate this workflow's source identity
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$WORKFLOW_REPOSITORY" != "solarssk/playbook" ]]; then
            echo "::error::This workflow requires its own source identity on GitHub.com."
            exit 1
          fi

      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the playbook at this workflow's exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: solarssk/playbook
          ref: ${{ job.workflow_sha }}
          path: .playbook-tools
          persist-credentials: false
          sparse-checkout: |
            scripts
            docs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: Run tier verification
        id: verification
        env:
          INPUT_TIER: ${{ inputs.tier }}
          ADMIN_TOKEN: ${{ secrets.admin_token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}  # read-only lookup of the latest playbook release
        run: node .playbook-tools/scripts/verify-tier.mjs
