name: OpenSSF Scorecard

# Report-only, kept off the pull request path. See docs/openssf.md for what it
# scores and how to read it.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 4 * * 3"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Scorecard reads workflow files for its own checks
      id-token: write # sign and publish results to the public Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
