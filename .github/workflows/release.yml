name: Release

# Publishes a GitHub Release when a version tag is pushed. The Release is what
# tells adopting repositories a new version exists: verify-tier.mjs asks the
# API for the latest Release and warns when a caller is pinned to an older one,
# and Dependabot (github-actions ecosystem) uses the same Release notes as the
# body of the PR that bumps a caller's pinned SHA. A bare tag does neither.
#
# Before publishing, scripts/release-check.mjs verifies that:
#   1. PLAYBOOK_RELEASE in verify-tier.yml equals the tag being released.
#   2. CHANGELOG.md has a non-empty section for this exact version, which
#      becomes the Release notes.
# The same script runs in CI on every pull request without a tag, so a release
# commit that forgets one of the two fails at review time.
#
# The Release carries a source archive, a SHA256SUMS file, and a signed build
# provenance attestation for the archive. Adopters pin a commit SHA, not this
# archive, but the attestation lets anyone verify that an archive came from
# this repository's own workflow:
#   gh attestation verify "playbook-${TAG}.tar.gz" --repo "${OWNER}/playbook"   (set TAG and OWNER first)
#
# To release: update CHANGELOG.md and PLAYBOOK_RELEASE in one commit, merge it,
# then tag that commit `vX.Y.Z` and push the tag.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Never cancel a release mid-flight, only queue behind it (docs/ci-cookbook.md #2b).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false # a release job must not restore a cache that PR runs could have written

      - name: Check the tag against the repository's own files and extract the notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NOTES_OUT: ${{ runner.temp }}/release-notes.md
        run: node scripts/release-check.mjs

      - name: Build the source archive and checksums
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="playbook-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="playbook-${TAG}/" --output="$archive" "$COMMIT"
          sha256sum "$archive" > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: playbook-*.tar.gz

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: gh release create "$TAG" "playbook-${TAG}.tar.gz" SHA256SUMS --title "$TAG" --notes-file "$NOTES_FILE" --verify-tag
