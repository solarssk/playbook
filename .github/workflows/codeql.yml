name: CodeQL

on:
  push:
    branches: [main]
  # No `branches:` filter on purpose: a filter on `pull_request` silently skips
  # this check for a PR stacked on another open PR (docs/ci-cookbook.md #5).
  pull_request: {}
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyzes the workflow files themselves (injection, unsafe
        # triggers); `javascript-typescript` covers scripts/.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: /language:${{ matrix.language }}
